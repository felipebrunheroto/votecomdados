name: Trivy (imagem)

# Fase 3 do plano DevSecOps/IaC. Builda as duas imagens do backend e roda
# o MESMO Trivy da Fase 2 (docs/PLANO_DEVSECOPS_IAC.md § 4 — uma ferramenta
# cobrindo imagem, IaC e SBOM), agora contra a imagem final, não só a
# árvore de dependências fonte. Publica o SBOM (CycloneDX) como artefato do
# build — rastreabilidade de supply chain coerente com a missão de
# transparência do projeto.

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
  # CVE nova não espera commit nosso.
  #
  # Os gatilhos acima só disparam com mudança em `backend/**`, então uma
  # semana sem tocar no backend é uma semana sem olhar a imagem. Em
  # 07/09/2026 três CVEs CRITICAL de bypass de autenticação no Tomcat
  # estavam na imagem EM PRODUÇÃO, e só apareceram porque um PR por acaso
  # tocou em `backend/**` -- o gate não tinha tido chance de falar antes.
  #
  # Segunda de manhã, e não sexta: achado de segurança precisa cair num dia
  # em que dê para agir sobre ele. 06:23 acompanha o CodeQL (06:00 do mesmo
  # dia) sem disputar runner com ele -- a varredura semanal de segurança fica
  # num bloco só, em vez de espalhada pela semana.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: trivy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modulo: [votecomdados-api, votecomdados-ingestion]
    steps:
      - uses: actions/checkout@v7

      - name: build da imagem
        working-directory: backend
        run: docker build -f ${{ matrix.modulo }}/Dockerfile -t ${{ matrix.modulo }}:${{ github.sha }} .

      - name: trivy image — bloqueia CRITICAL com correção disponível
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.modulo }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Sem isto, a falha aparece como um X vermelho e o motivo fica enterrado
      # no log do passo. Para o disparo semanal isso é decisivo: quem recebe a
      # notificação precisa ver O QUE está vulnerável sem abrir o run.
      - name: resumo do que falhou
        if: failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.modulo }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          output: achados-${{ matrix.modulo }}.txt

      - name: publica o resumo
        if: failure()
        run: |
          {
            echo "### CRITICAL com correção disponível em \`${{ matrix.modulo }}\`"
            echo ""
            echo '```'
            cat achados-${{ matrix.modulo }}.txt || echo "(sem detalhe: o scan nao chegou a rodar)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ matrix.modulo }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.modulo }}.cdx.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ matrix.modulo }}
          path: sbom-${{ matrix.modulo }}.cdx.json
          retention-days: 90
