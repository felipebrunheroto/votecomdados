name: Buscar emendas (CGU)

# Invoca a Lambda em sa-east-1 que busca as emendas do ano e grava o JSON no
# bucket de ingestão.
#
# A busca mora em São Paulo porque a API da CGU recusa requisição vinda de
# fora do Brasil — medido em 26/09/2026: 200 de máquina doméstica brasileira,
# 401 do CloudShell em sa-east-1 (alcança, só quer a chave), e 504 do ECS em
# us-east-1 e do runner do GitHub Actions. Ver infra/emendas.tf.
#
# Este workflow existe porque a Lambda precisa de um gatilho operável: o IAM
# user de bootstrap não tem `lambda:InvokeFunction`, e ampliá-lo à mão para
# isso deixaria resíduo de permissão. A role do Actions já tem PowerUser.

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano a buscar (padrão: ano corrente)"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: buscar-emendas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: invoca a Lambda e espera o arquivo
        env:
          ANO: ${{ inputs.ano }}
        run: |
          set -uo pipefail
          ano="${ANO:-$(date -u +%Y)}"
          conta=$(aws sts get-caller-identity --query Account --output text)
          balde="votecomdados-ingestao-$conta"
          chave="entrada/emendas-$ano.json"

          # ASSINCRONA, de proposito. A invocacao sincrona foi tentada em
          # 27/09 e a conexao caiu antes da resposta:
          #
          #   Connection was closed before we received a valid response
          #   from endpoint URL: .../invocations
          #
          # O log da Lambda mostrava INIT_START e START -- a funcao rodou. O
          # que nao sobrevive e a conexao HTTP mantida aberta por ~500s
          # enquanto a funcao trabalha. Com --invocation-type Event a
          # chamada volta na hora e o resultado se observa pelo S3, que e o
          # proprio produto da funcao.
          antes=$(aws s3api head-object --bucket "$balde" --key "$chave" \
                    --query LastModified --output text 2>/dev/null || echo "nunca")
          echo "arquivo antes: $antes"

          aws lambda invoke \
            --function-name votecomdados-buscar-emendas \
            --invocation-type Event \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"ano\":$ano}" \
            aceite.json
          echo "invocacao aceita; aguardando o arquivo aparecer"

          # A funcao leva ~520s pela medicao do spike. 20 min de teto da
          # folga sem mascarar travamento.
          for _ in $(seq 1 80); do
            sleep 15
            agora=$(aws s3api head-object --bucket "$balde" --key "$chave" \
                      --query LastModified --output text 2>/dev/null || echo "nunca")
            if [ "$agora" != "$antes" ] && [ "$agora" != "nunca" ]; then
              tamanho=$(aws s3api head-object --bucket "$balde" --key "$chave" \
                          --query ContentLength --output text)
              echo "pronto: $chave  ($tamanho bytes, $agora)"
              {
                echo "### Busca de emendas — $ano"
                echo ""
                echo "- objeto: \`s3://$balde/$chave\`"
                echo "- tamanho: $tamanho bytes"
                echo "- gravado em: $agora"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo "::error::o arquivo nao apareceu em 20 min; veja o log da Lambda abaixo"
          exit 1

      # Sem isto, diagnosticar falha exige credencial e console. O passo de
      # 27/09 ficou uma hora sem dizer NADA sobre o que a funcao estava
      # fazendo -- a causa teve de ser inferida por aritmetica.
      - name: o que a Lambda registrou
        if: always()
        run: |
          set -uo pipefail
          aws logs tail /aws/lambda/votecomdados-buscar-emendas \
            --since 30m --format short 2>/dev/null | tail -40 || \
            echo "(sem log no periodo)"
