name: Verificar guardrails

# Fase 8 do plano DevSecOps/IaC: "alarme não testado é alarme que não existe".
#
# Existe porque três coisas podem estar erradas SEM nenhum sinal:
#
#   1. A assinatura de e-mail do SNS fica `PendingConfirmation` até alguém
#      clicar no link que a AWS manda. Nesse estado o alarme dispara e a
#      notificação não chega a lugar nenhum.
#   2. A métrica AWS/Billing só existe se "Receive Billing Alerts" estiver
#      ligado em Billing Preferences — configuração de conta, que o Terraform
#      não consegue ligar. Sem isso os alarmes de custo ficam para sempre em
#      INSUFFICIENT_DATA, sem nunca disparar.
#   3. O backup pode estar configurado e nunca ter produzido snapshot.
#
# Só leitura por padrão. O teste de ENTREGA (que manda e-mail de verdade) é
# opt-in, porque acionar alarme de produção sem avisar confunde quem vê.

on:
  workflow_dispatch:
    inputs:
      enviar_email:
        description: "Manda o relatorio por e-mail tambem neste disparo manual"
        type: boolean
        default: false
      testar_entrega:
        description: "Forca o alarme de billing 50% para ALARM e volta — manda e-mail DE VERDADE"
        type: boolean
        default: false
  schedule:
    # DIARIO, 06:40 UTC. Era semanal, junto do CodeQL e do Trivy, tratando
    # isto como varredura de seguranca. Nao e: e conferencia operacional, e a
    # diferenca ficou clara em 11/09/2026.
    #
    # Alarme cobre o que DISPARA -- ingestao quebrada, 5xx, custo. Este
    # workflow cobre o que nao dispara nada:
    #
    #   - assinatura do SNS sumida (aconteceu: deixou TODO alarme mudo)
    #   - "Receive Billing Alerts" desligado na conta (aconteceu)
    #   - retencao de backup sem snapshot nenhum
    #
    # As tres sao silenciosas por natureza. Na cadencia semanal, uma delas
    # numa terca so apareceria na segunda seguinte -- e, se fosse a primeira,
    # nenhum alarme funcionaria durante o intervalo inteiro.
    #
    # Custa algumas chamadas de leitura e o download dos logs do dia. Em
    # repositorio publico os minutos sao gratuitos. O preco de errar a
    # cadencia para menos e bem maior que o de rodar todo dia.
    - cron: "40 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: a assinatura de e-mail esta confirmada?
        run: |
          set -euo pipefail
          TOPICO=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':votecomdados-alarmes')].TopicArn | [0]" \
            --output text)

          if [ "$TOPICO" = "None" ] || [ -z "$TOPICO" ]; then
            echo "::error::topico votecomdados-alarmes nao existe"
            exit 1
          fi

          PENDENTES=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPICO" \
            --query "length(Subscriptions[?SubscriptionArn=='PendingConfirmation'])" \
            --output text)
          CONFIRMADAS=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPICO" \
            --query "length(Subscriptions[?SubscriptionArn!='PendingConfirmation'])" \
            --output text)

          echo "assinaturas confirmadas: $CONFIRMADAS | pendentes: $PENDENTES"

          if [ "$CONFIRMADAS" -eq 0 ]; then
            echo "::error::nenhuma assinatura confirmada — TODO alarme deste projeto e mudo"
            {
              echo "### Nenhuma assinatura confirmada no SNS"
              echo ""
              echo "Os alarmes disparam e a notificacao nao chega. A AWS mandou um"
              echo "e-mail de confirmacao para o endereco de billing quando o topico"
              echo "foi criado — e preciso clicar no link dele."
            } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # O topico de relatorio tem a MESMA fragilidade do de alarmes: assinatura
      # de e-mail exige confirmacao, e sem ela nao chega nada -- so que aqui a
      # ausencia seria ainda mais silenciosa, porque relatorio que nao chega
      # parece "dia sem novidade".
      - name: a assinatura do relatorio esta confirmada?
        run: |
          set -euo pipefail
          TOPICO=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':votecomdados-relatorio')].TopicArn | [0]" \
            --output text)

          if [ "$TOPICO" = "None" ] || [ -z "$TOPICO" ]; then
            echo "topico de relatorio ainda nao existe"
            exit 0
          fi

          PEND=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPICO" \
            --query "length(Subscriptions[?SubscriptionArn=='PendingConfirmation'])" --output text)
          OK=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPICO" \
            --query "length(Subscriptions[?SubscriptionArn!='PendingConfirmation'])" --output text)
          echo "relatorio — confirmadas: $OK | pendentes: $PEND"

          if [ "$OK" -eq 0 ]; then
            {
              echo ""
              echo "### Relatório por e-mail não está chegando"
              echo ""
              echo "A assinatura do tópico \`votecomdados-relatorio\` não foi"
              echo "confirmada. A AWS mandou um link para o e-mail de billing;"
              echo "sem clicar nele, este relatório existe e não chega a ninguém."
            } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      # O alarme de billing diz "passou de 50%". Nao diz DE QUE.
      #
      # Em 27/09/2026 a pergunta "por que o maior custo e S3?" exigiu abrir o
      # Cost Explorer no console e mandar print — e a resposta (quase tudo em
      # PUT, nao em armazenamento) mudou a decisao de pre-render. Pergunta que
      # muda decisao nao deveria custar uma visita manual ao console.
      #
      # UMA chamada, agrupada por SERVICE **e** USAGE_TYPE (o Cost Explorer
      # aceita duas dimensoes). A primeira versao filtrava por
      # SERVICE="Amazon Simple Storage Service" e devolveu "nenhum custo" em
      # 30/09/2026, o que era implausivel — sem filtro nao ha nome de servico
      # para errar, e a tabela por servico responde a pergunta maior ("para
      # onde vai o dinheiro") pelo mesmo preco.
      #
      # CUSTA DINHEIRO: a API cobra US$ 0,01 por requisicao. Uma por dia da
      # US$ 0,30/mes. Fica declarado na propria secao, para nao ser surpresa
      # na fatura: monitoramento de custo que custa em silencio seria piada
      # ruim. Se paga se evitar um unico mes de PUT desnecessario.
      #
      # `|| true` porque a API recusa com AccessDenied enquanto "IAM user and
      # role access to Billing information" estiver desligado nas preferencias
      # da conta — configuracao de conta, que o Terraform nao liga. Recusa ali
      # nao deve derrubar o relatorio inteiro.
      #
      # jq e nao python de proposito: heredoc de python dentro de `run: |`
      # indentado nao fecha, porque o terminador precisa da coluna 0.
      - name: para onde vai o dinheiro
        run: |
          set -uo pipefail

          # `End` do Cost Explorer e exclusivo: e o dia 1 do mes seguinte.
          #
          # Aritmetica explicita em vez de `date -u -d "+1 month"`: aquele -d e
          # do date do GNU, roda no ubuntu do Actions e nao num Mac, o que
          # tornaria este passo impossivel de testar fora do CI. E a virada de
          # dezembro fica visivel aqui em vez de quebrar uma vez por ano.
          ANO="$(date -u +%Y)"; MES="$(date -u +%m)"
          INICIO="$ANO-$MES-01"
          if [ "$MES" = "12" ]; then
            FIM="$((ANO + 1))-01-01"
          else
            FIM="$ANO-$(printf '%02d' "$((10#$MES + 1))")-01"
          fi

          aws ce get-cost-and-usage \
            --time-period "Start=$INICIO,End=$FIM" \
            --granularity MONTHLY --metrics UnblendedCost UsageQuantity \
            --group-by Type=DIMENSION,Key=SERVICE Type=DIMENSION,Key=USAGE_TYPE \
            --output json > custo.json 2> custoerro.txt || true

          TABELA=""
          if [ -s custo.json ]; then
            TABELA="$(jq -r '
              def dinheiro:
                (. * 100 | round) as $c
                | if $c == 0 then "0.00" else
                    (if $c < 0 then "-" else "" end) as $sinal
                    | ($c | fabs) as $a
                    | ($a / 100 | floor) as $i
                    | ($a - $i * 100) as $f
                    | "\($sinal)\($i).\(if $f < 10 then "0" else "" end)\($f)"
                  end;

              def milhar:
                tostring | explode | reverse
                | [ range(0; length) as $i | if ($i > 0 and $i % 3 == 0) then [46, .[$i]] else [.[$i]] end ]
                | flatten | reverse | implode;

              [ .ResultsByTime[].Groups[]
                | { s: .Keys[0], u: (.Keys[1] // "-"),
                    v: (.Metrics.UnblendedCost.Amount | tonumber),
                    q: (.Metrics.UsageQuantity.Amount | tonumber) } ] as $tudo
              | ($tudo | map(select(.v > 0))) as $t
              | if ($t | length) == 0 then "VAZIO" else
                  ($t | map(.v) | add) as $soma
                  | ( "| US$ | % | serviço |", "|---:|---:|---|",
                      ( $t | group_by(.s) | map({ s: .[0].s, v: (map(.v) | add) })
                        | sort_by(-.v) | .[:10][]
                        | "| \(.v | dinheiro) | \(.v / $soma * 1000 | round / 10)% | \(.s) |" ),
                      "| **\($soma | dinheiro)** | | **total da conta** |" )
                  , ( ($tudo | map(select((.s | test("Storage Service")) and .q > 0))
                        | sort_by(-.q)) as $s3
                      | if ($s3 | length) == 0 then empty else
                          ( "", "Dentro do S3 — por VOLUME, nao por custo:", "",
                            "| requisições/GB-mês | US$ | tipo de uso |", "|---:|---:|---|",
                            ( $s3[:8][]
                              | "| \(.q | round | milhar) | \(.v | dinheiro) | `\(.u)` |" ) )
                        end )
                end
            ' custo.json 2>/dev/null)" || TABELA=""
          fi

          {
            echo ""
            echo "### Para onde vai o dinheiro (mes corrente)"
            echo ""
            if [ "$TABELA" = "VAZIO" ]; then
              echo "Nenhum custo lancado neste mes ainda. O Cost Explorer atrasa"
              echo "cerca de 24h, entao no dia 1 isto fica vazio por algumas horas."
            elif [ -n "$TABELA" ]; then
              echo "$TABELA"
              echo ""
              echo "_\`Requests-Tier1\` e PUT/COPY/POST/LIST; \`Requests-Tier2\` e GET._"
              echo ""
              echo "_Uma publicacao do site reescreve ~303 mil objetos: 60.570"
              echo "paginas x 5 arquivos, medido no export (\`index.html\`,"
              echo "\`index.txt\` e tres \`.txt\` de RSC por pagina). Da US\$ 1,51 de"
              echo "PUT por deploy. O custo acompanha o NUMERO DE PUBLICACOES,"
              echo "nao o tamanho do site nem o trafego: \`s3 sync\` compara"
              echo "tamanho e mtime, e \`next build\` renova o mtime de tudo,"
              echo "entao cada deploy reescreve o site inteiro._"
              echo ""
              echo "_A tabela do S3 e por VOLUME e nao por custo de proposito._"
              echo "_\`UnblendedCost\` e o valor efetivamente cobrado, ja sem o que"
              echo "o Free Tier absorveu — entao S3 com custo zero nao significa"
              echo "\"sem uso\", significa \"dentro da franquia\". Ordenar por custo"
              echo "fazia a linha desaparecer exatamente no caso que interessa"
              echo "explicar. O volume e o que diz QUANDO o zero deixa de ser"
              echo "zero; o custo so avisa depois._"
            else
              echo "**Cost Explorer nao respondeu.** Motivo:"
              echo ""
              echo '```'
              head -3 custoerro.txt 2>/dev/null || echo "(sem detalhe)"
              echo '```'
              echo ""
              echo "Se for \`AccessDenied\`, falta ligar _IAM user and role access"
              echo "to Billing information_ em Account settings. E configuracao de"
              echo "conta; o Terraform nao liga."
            fi
            echo ""
            echo "_Esta secao consome 1 requisicao do Cost Explorer por dia, a"
            echo "US\$ 0,01 cada._"
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

      - name: os alarmes de custo tem dado para avaliar?
        run: |
          set -euo pipefail
          aws cloudwatch describe-alarms \
            --alarm-names votecomdados-billing-50pct votecomdados-billing-80pct \
                          votecomdados-billing-100pct votecomdados-5xx-sustentado \
                          votecomdados-ingestao-falhou-2-dias \
            --query 'MetricAlarms[].{Alarme:AlarmName,Estado:StateValue,Desde:StateUpdatedTimestamp}' \
            --output table | tee estados.txt

          {
            echo "### Estado dos alarmes"
            echo ""
            echo '```'
            cat estados.txt
            echo '```'
            echo ""
            echo "_\`Desde\` existe porque em 29/09/2026 este relatorio disse"
            echo "\`ingestao-falhou-2-dias = ALARM\` e nao havia como saber, do"
            echo "e-mail, se o problema era de agora ou residuo de dois dias"
            echo "antes — o alarme exige erro em DOIS dias seguidos e leva"
            echo "\`period = 86400\`, entao muda de estado com atraso de ate um"
            echo "dia. Sem a data, \`ALARM\` velho e \`ALARM\` novo sao iguais na"
            echo "tela, e um alarme que nao distingue os dois ensina a ignora-lo._"
            echo ""
            echo "_Para o que o alarme NAO responde — qual fonte, qual erro —"
            echo "ha o workflow \`Logs da ingestão\`, e o \`/api/v1/meta/status\`"
            echo "diz a hora da ultima execucao de cada fonte._"
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

          # INSUFFICIENT_DATA num alarme de billing quase sempre significa
          # "Receive Billing Alerts" desligado nas preferencias da conta.
          SEM_DADO=$(aws cloudwatch describe-alarms \
            --alarm-names votecomdados-billing-50pct \
            --query "length(MetricAlarms[?StateValue=='INSUFFICIENT_DATA'])" --output text)

          if [ "$SEM_DADO" != "0" ]; then
            echo "::error::billing-50pct sem dado — provavelmente 'Receive Billing Alerts' esta desligado"
            {
              echo ""
              echo "**O alarme de billing nunca vai disparar.** A metrica AWS/Billing so"
              echo "existe com _Receive Billing Alerts_ ligado em Billing Preferences —"
              echo "e configuracao de conta, o Terraform nao liga."
            } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: o backup do banco existe de fato?
        run: |
          set -euo pipefail
          RETENCAO=$(aws rds describe-db-instances --db-instance-identifier votecomdados \
            --query 'DBInstances[0].BackupRetentionPeriod' --output text)
          ULTIMO=$(aws rds describe-db-snapshots --db-instance-identifier votecomdados \
            --snapshot-type automated \
            --query 'sort_by(DBSnapshots,&SnapshotCreateTime)[-1].SnapshotCreateTime' \
            --output text)

          echo "retencao: $RETENCAO dia(s) | snapshot mais recente: $ULTIMO"
          {
            echo ""
            echo "### Backup"
            echo ""
            echo "- retencao: **$RETENCAO dia(s)**"
            echo "- snapshot automatico mais recente: **$ULTIMO**"
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

          if [ "$ULTIMO" = "None" ]; then
            echo "::error::nenhum snapshot automatico — backup configurado nao e backup existente"
            exit 1
          fi

      # Tráfego não é guardrail, mas chega junto porque o custo marginal é
      # zero: a métrica já existe, o job já tem credencial, e ninguém vai
      # abrir console toda semana só para isso.
      #
      # ARQUITETURA.md e o plano de custos assumem "~1.000 visitas/dia" em
      # várias decisões -- Redis removido, cache de 5 min, porte do RDS. Nunca
      # foi medido. Este número é o que permite conferir a premissa.
      - name: trafego dos ultimos 7 dias
        run: |
          set -euo pipefail

          FIM=$(date -u +%Y-%m-%dT%H:00:00Z)
          INICIO=$(date -u -d '7 days ago' +%Y-%m-%dT%H:00:00Z)

          aws cloudwatch get-metric-statistics \
            --namespace AWS/CloudFront \
            --metric-name Requests \
            --dimensions Name=DistributionId,Value=${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
                         Name=Region,Value=Global \
            --start-time "$INICIO" --end-time "$FIM" \
            --period 86400 --statistics Sum \
            --query 'sort_by(Datapoints,&Timestamp)[].[Timestamp,Sum]' \
            --output text > trafego.txt || true

          {
            echo ""
            echo "### Requisições no CloudFront (7 dias)"
            echo ""
            if [ -s trafego.txt ]; then
              echo "| dia | requisições |"
              echo "|---|---|"
              while read -r ts soma; do
                printf "| %s | %.0f |\n" "${ts%%T*}" "$soma"
              done < trafego.txt
              echo ""
              echo "_Requisição não é visita._ Uma página estática carrega HTML"
              echo "mais vários chunks de JS e fontes, então o número infla."
              echo "Serve para tendência, não para contar pessoas."
            else
              echo "Sem dado no período — distribuição nova, ou sem tráfego."
            fi
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

      # Quais páginas interessam — a metade da pergunta que a métrica do
      # CloudWatch não responde, porque ela conta requisição sem saber de quê.
      #
      # O log não traz identificação de ninguém (ver infra/acesso.tf): só data,
      # hora, caminho, status e hit/miss. Isto agrega caminho, que é para o que
      # ele foi ligado.
      - name: paginas mais acessadas (7 dias)
        run: |
          set -uo pipefail

          CONTA=$(aws sts get-caller-identity --query Account --output text)
          BALDE="votecomdados-acesso-$CONTA"
          DESDE=$(date -u -d '7 days ago' +%Y-%m-%d)

          # Filtra pela data que o S3 reporta, em vez de adivinhar o formato do
          # prefixo que a entrega v2 usa -- ele muda conforme a configuração e
          # não vale codificar aqui.
          aws s3 ls "s3://$BALDE/" --recursive 2>/dev/null \
            | awk -v d="$DESDE" '$1 >= d {print $4}' | head -500 > chaves.txt || true

          if [ ! -s chaves.txt ]; then
            {
              echo ""
              echo "### Páginas mais acessadas (7 dias)"
              echo ""
              echo "Sem log no período. O CloudFront entrega em lote — se o"
              echo "logging foi ligado há pouco, ainda não há arquivo."
            } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p log
          while read -r chave; do
            aws s3 cp "s3://$BALDE/$chave" log/ --quiet || true
          done < chaves.txt

          # Descomprime o que for .gz e copia o que ja vier em texto: o formato
          # da entrega v2 nao e o mesmo do legado, e nao vale apostar.
          mkdir -p cru
          for f in log/*; do
            case "$f" in
              *.gz) gunzip -c "$f" >> cru/tudo.txt 2>/dev/null || true ;;
              *)    cat "$f" >> cru/tudo.txt 2>/dev/null || true ;;
            esac
          done

          # Diagnostico no log do job (nao no resumo): quando o formato muda,
          # este e o unico lugar que diz O QUE chegou. Sem isto, a unica pista
          # seria "nenhuma linha de pagina", que nao ajuda ninguem.
          echo "arquivos baixados: $(ls log 2>/dev/null | wc -l)"
          echo "linhas cruas: $(wc -l < cru/tudo.txt 2>/dev/null || echo 0)"
          echo "primeira linha: $(head -1 cru/tudo.txt 2>/dev/null | cut -c1-160)"

          # Onde esta cs-uri-stem, por ordem de confianca:
          #
          #   1. cabecalho do v2 -- os nomes dos campos SEM prefixo, que foi o
          #      que o diagnostico mostrou em producao (11/09/2026);
          #   2. cabecalho legado `#Fields:`, com prefixo;
          #   3. a ordem declarada em infra/acesso.tf, como ultimo recurso.
          #
          # A primeira versao deste passo so conhecia (2) e descartava tudo. A
          # segunda acertou por acidente -- caiu em (3) e a posicao coincidia.
          # Ler o nome e melhor que contar coluna: se alguem mexer em
          # record_fields, isto acompanha em vez de passar a contar errado.
          awk '
            /^#Fields:/ {
              for (i = 2; i <= NF; i++) {
                if ($i == "cs-uri-stem") coluna = i - 1
                if ($i == "sc-status")   status = i - 1
              }
              next
            }
            /^#/ { next }
            coluna == 0 && $0 ~ /cs-uri-stem/ {
              for (i = 1; i <= NF; i++) {
                if ($i == "cs-uri-stem") coluna = i
                if ($i == "sc-status")   status = i
              }
              next
            }
            {
              if (coluna == 0) coluna = 3
              if (status == 0) status = 4
              caminho = $coluna
              if (caminho == "" || caminho !~ /^\//) next
              if (caminho ~ /^\/_next\//) next
              if (caminho ~ /\.(js|css|woff2?|ico|png|svg|json|txt|map)$/) next
              # So conta pagina realmente servida. Sem isto, a lista mede quem
              # esta varrendo, nao o que interessa a quem le: em 25/09/2026 as
              # sondas de `.env` ocupavam oito das dez linhas. Elas continuam
              # no log -- e devem continuar --, mas agora com 404, e 404 nao e
              # pagina que interessou a ninguem.
              #
              # 304 entra junto com os 2xx: significa que a pessoa PEDIU a
              # pagina e o navegador revalidou o cache. E leitura, e descartar
              # subnotifica justamente quem volta ao site. Redirecionamento
              # (301/302) fica de fora -- e salto, nao leitura.
              if ($status !~ /^2[0-9][0-9]$/ && $status != 304) next

              print "PAGINA " caminho

              # A FAMILIA da rota, no mesmo fluxo e com prefixo.
              #
              # O top-10 por URL nao responde a pergunta que decide o
              # pre-render: /proposicoes/{id} sao 50.073 enderecos distintos,
              # e nenhum deles isoladamente cabe num top-10 dominado pela
              # home -- mesmo que a familia inteira receba trafego relevante.
              #
              # split, e nao sub com captura: o sub do awk NAO tem
              # retrovisor de grupo, so `&` para o casamento inteiro. A
              # primeira versao disto emitiu o literal "\\1*" para todas as
              # linhas de profundidade maior que um.
              n = split(caminho, partes, "/")
              if (caminho == "/") familia = "/"
              else if (n <= 3) familia = caminho      # "/sobre/" -> "", "sobre", ""
              else familia = "/" partes[2] "/*"
              print "FAMILIA " familia
            }
          ' cru/tudo.txt > classificadas.txt || true

          grep '^PAGINA ' classificadas.txt | cut -d' ' -f2- \
            | sort | uniq -c | sort -rn | head -10 > topo.txt || true
          # Teto de 20 linhas, com o resto SOMADO numa linha propria em vez de
          # cortado em silencio.
          #
          # O relatorio de 29/09/2026 trouxe 290 linhas aqui e ficou ilegivel.
          # A causa nao era a agregacao: era o soft-404 do site inteiro, que
          # fazia `/login`, `/admin`, `/Dockerfile` e companhia responderem
          # 200 e entrarem numa tabela que só conta 2xx — a propria nota
          # abaixo dizia "sondagem leva 404 e nao entra", e era falsa. A
          # correcao real foi na borda (infra/funcoes/roteamento.js). O teto
          # aqui é o cinto de seguranca: a tabela existe para ser lida num
          # e-mail, e nenhuma decisao de pre-render precisa da 21a linha.
          grep '^FAMILIA ' classificadas.txt | cut -d' ' -f2- \
            | sort | uniq -c | sort -rn > familias-todas.txt || true
          head -20 familias-todas.txt > familias.txt || true
          RESTO_LINHAS=$(($(wc -l < familias-todas.txt) - $(wc -l < familias.txt)))
          RESTO_ACESSOS=$(tail -n +21 familias-todas.txt | awk '{s+=$1} END {print s+0}')

          # O log do CloudFront ja chega percent-encoded, entao um caminho que
          # JA era codificado aparece codificado DUAS vezes: TIETE saiu como
          # `/municipios/SP/TIET%25C3%258A/` no relatorio de 30/09/2026.
          # Ilegivel, e pior, parecia um endereco diferente do que o site
          # serve. Duas passadas devolvem o nome: %25C3%258A -> %C3%8A -> Ê.
          #
          # `printf %b` nao reinterpreta a propria saida, entao a segunda
          # passada nao transforma um `\n` que tenha vindo do caminho em
          # quebra de linha.
          decodificar() {
            local uma
            uma="$(printf '%b' "${1//%/\\x}")"
            printf '%b' "${uma//%/\\x}"
          }

          {
            echo ""
            echo "### Acessos por área do site (7 dias)"
            echo ""
            if [ -s familias.txt ]; then
              echo "| acessos | área |"
              echo "|---|---|"
              while read -r n familia; do
                echo "| $n | \`$(decodificar "$familia")\` |"
              done < familias.txt
              echo ""
              if [ "$RESTO_LINHAS" -gt 0 ]; then
                echo "| $RESTO_ACESSOS | _(outras $RESTO_LINHAS famílias, somadas)_ |"
              fi
              echo ""
              echo "_Agregado por família de rota. É o número que decide se vale"
              echo "pré-renderizar \`/proposicoes/*\` e \`/votacoes/*\`: 58.276"
              echo "páginas, que viram 291 mil dos 302.872 objetos reescritos a"
              echo "cada publicação._"
              echo ""
              echo "_Dizia aqui que elas \"respondem por quase todo o custo de"
              echo "S3\". Medido em 30/09/2026, o custo de S3 é **US\$ 0,00** — o"
              echo "crédito do Free Tier absorve os 17,1 milhões de PUT do mês."
              echo "Elas respondem por quase todo o VOLUME, que é outra coisa: o"
              echo "volume diz quando o zero deixa de ser zero, e é por isso que"
              echo "a decisão continua de pé sem ser urgência de caixa._"
              echo ""
              echo "_O top-10 por URL abaixo não serve para decidir: são 58.276"
              echo "endereços distintos,"
              echo "e nenhum cabe sozinho num top-10 dominado pela home._"
            else
              echo "Sem linhas de página no período."
            fi
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "### Páginas mais acessadas (7 dias)"
            echo ""
            if [ -s topo.txt ]; then
              echo "| acessos | página |"
              echo "|---|---|"
              while read -r n caminho; do
                echo "| $n | \`$(decodificar "$caminho")\` |"
              done < topo.txt
              echo ""
              echo "_Assets excluídos (\`/_next/\`, fontes, ícones): uma visita"
              echo "carrega dezenas deles e afogaria a lista. Só contam"
              echo "respostas 2xx e 304._"
              echo ""
              echo "_Sondagem só deixou de entrar em 29/09/2026. Até ali o site"
              echo "respondia 200 para QUALQUER caminho inexistente, e por isso"
              echo "\`/.env\`, \`/login\` e \`/admin\` apareciam aqui. A janela de 7"
              echo "dias ainda arrasta esses dias por uma semana._"
            else
              echo "Arquivos encontrados, mas nenhuma linha de página — pode ser"
              echo "tráfego só de assets, ou mudança no formato do log."
            fi
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"

      # O relatorio vai por e-mail, no topico SEPARADO do de alarmes.
      #
      # `if: always()` porque a mensagem mais importante e justamente a de um
      # run que FALHOU: e quando a assinatura sumiu, o billing esta desligado
      # ou o backup nao existe. Mandar so quando tudo vai bem seria mandar
      # exatamente quando nao precisa.
      # O relatorio inteiro tambem no LOG do run.
      #
      # Cada secao faz `tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"`, o que
      # o coloca no painel de resumo e no e-mail, mas nao no log. Isso deixava
      # duas lacunas: `workflow_dispatch` nao manda e-mail (o gate de
      # `enviar_email` existe justamente para nao disparar e-mail em teste),
      # entao uma execucao manual gravava o relatorio onde nenhuma ferramenta
      # le; e comparar duas execucoes exigia abrir dois paineis em vez de
      # buscar no log.
      #
      # `if: always()` pelo mesmo motivo do e-mail: a execucao que interessa
      # mais e a que falhou.
      - name: o relatorio, tambem no log
        if: always()
        run: cat relatorio.txt 2>/dev/null || echo "(relatorio vazio)"

      - name: manda o relatorio por e-mail
        # Agendado sempre; manual só quando pedido. O envio precisa ser
        # exercitável sob demanda: um caminho que só roda às 06:40 e cuja
        # falha se manifesta como AUSÊNCIA de e-mail é indistinguível de um
        # dia tranquilo -- exatamente o modo de falha que este workflow existe
        # para eliminar.
        if: always() && (github.event_name == 'schedule' || inputs.enviar_email)
        run: |
          set -uo pipefail

          TOPICO=$(aws sns list-topics \
            --query "Topics[?ends_with(TopicArn, ':votecomdados-relatorio')].TopicArn | [0]" \
            --output text)
          if [ "$TOPICO" = "None" ] || [ -z "$TOPICO" ]; then
            echo "::warning::topico de relatorio nao existe; nada enviado"
            exit 0
          fi

          # Markdown vira texto: negrito e cerca de tabela nao ajudam ninguem
          # num cliente de e-mail em texto puro.
          # A ultima expressao apaga a linha separadora de tabela markdown
          # (|---|---|), que em texto puro e so ruido.
          sed -e 's/\*\*//g' -e 's/^### /== /' -e 's/^_//' -e 's/_$//' \
              -e '/^|[-|[:space:]]*|$/d' \
            relatorio.txt > corpo.txt 2>/dev/null || echo "(sem conteudo)" > corpo.txt

          {
            echo "Relatorio diario do VoteComDados"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            cat corpo.txt
          } > mensagem.txt

          # 256 KB e o limite do SNS; o relatorio e muito menor, mas cortar e
          # melhor que a publicacao falhar em silencio num dia atipico.
          head -c 200000 mensagem.txt > enviar.txt

          aws sns publish --topic-arn "$TOPICO" \
            --subject "VoteComDados - conferencia diaria" \
            --message "file://enviar.txt" >/dev/null \
            && echo "relatorio enviado" \
            || echo "::warning::falha ao publicar o relatorio"

      # Isto e o unico passo que MUDA algo, e por isso e opt-in. Forcar o
      # estado e melhor que "gastar de proposito": a metrica de billing so
      # atualiza a cada ~6h, e cruzar 50% de US$170 de verdade custaria
      # US$85. O que precisa ser provado e o CAMINHO da notificacao, e esse
      # e identico nos dois casos.
      - name: teste de entrega (manda e-mail de verdade)
        if: inputs.testar_entrega
        run: |
          set -euo pipefail
          aws cloudwatch set-alarm-state \
            --alarm-name votecomdados-billing-50pct \
            --state-value ALARM \
            --state-reason "Fase 8: teste de entrega da notificacao"

          echo "alarme forcado para ALARM; devolvendo a OK"
          aws cloudwatch set-alarm-state \
            --alarm-name votecomdados-billing-50pct \
            --state-value OK \
            --state-reason "Fase 8: fim do teste"

          {
            echo ""
            echo "### Teste de entrega disparado"
            echo ""
            echo "Confira a caixa de entrada do e-mail de billing: devem ter chegado"
            echo "duas mensagens (ALARM e OK). Se nao chegaram, o problema esta na"
            echo "entrega, nao na regra — e nenhum alarme deste projeto funciona."
          } | tee -a relatorio.txt >> "$GITHUB_STEP_SUMMARY"
