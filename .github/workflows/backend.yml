name: Backend

# Fase 1 do plano DevSecOps/IaC (docs/PLANO_DEVSECOPS_IAC.md) — roda o que
# antes só existia como `./mvnd clean test` manual. O runner já tem Docker,
# então os testes de integração (Testcontainers) funcionam sem o wrapper
# `mvnd` local, que só existe porque a máquina de dev não tem JDK.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: mvn clean test
        working-directory: backend
        run: mvn -B -ntp clean test
