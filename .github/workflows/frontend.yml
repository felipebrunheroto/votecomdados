name: Frontend

# Fase 1 do plano DevSecOps/IaC. `npm run build` sem NEXT_PUBLIC_API_URL
# roda com as fixtures (ver web/src/lib/api/cliente.ts) — prova que o export
# estático continua saindo mesmo sem backend, o mesmo caminho que
# `next.config.ts` força de verdade em qualquer `next build` (NODE_ENV
# vira "production" automaticamente, então `output: "export"` está sempre
# ativo aqui, sem precisar de variável nenhuma — ver docs/PLANO_CORRECAO_STATIC_PARAMS.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
