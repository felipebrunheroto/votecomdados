name: Deploy frontend

# Fase 7 do plano DevSecOps/IaC — implementa o pipeline já especificado em
# docs/FRONTEND.md § 1 "Pipeline de rebuild" e § 9 "Deploy (CI)".
#
# O GATILHO É DE PUXAR, NÃO DE EMPURRAR. O cron compara o watermark da API
# (`/meta/status`) com o do `build-info.json` publicado na CDN e só
# reconstrói se forem diferentes. O desenho alternativo — o worker chamar
# um webhook ao terminar a ingestão — foi rejeitado por falhar em silêncio
# (achado A8): se a chamada se perdesse, o site nunca era reconstruído e
# ninguém percebia. Aqui não existe mensagem para se perder, e uma execução
# que falhe é corrigida pela seguinte, sem intervenção.

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora; 17 para não competir com o pico do topo da hora
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reconstruir mesmo se o watermark não mudou"
        type: boolean
        default: false

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  API_URL: https://api.${{ vars.DOMINIO }}/api/v1
  SITE_URL: https://${{ vars.DOMINIO }}

jobs:
  decidir:
    runs-on: ubuntu-latest
    outputs:
      reconstruir: ${{ steps.comparar.outputs.reconstruir }}
      watermark: ${{ steps.comparar.outputs.watermark }}
    steps:
      - id: comparar
        run: |
          set -euo pipefail

          # Mudança em web/** ou disparo manual com `forcar` reconstroem sem
          # PERGUNTAR se precisam: o motivo do rebuild é o próprio código, e
          # uma API fora do ar não pode impedir a publicação de código novo.
          #
          # Mas o watermark ainda é registrado. Publicá-lo vazio fazia todo
          # cron seguinte comparar hash-real contra "", concluir que o site
          # estava defasado e reconstruir -- de hora em hora, para sempre.
          # Aconteceu em 08/09/2026: um build de ~79 mil páginas por hora, com
          # o S3 e a invalidação de CDN junto.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.forcar }}" = "true" ]; then
            echo "reconstruir=true" >> "$GITHUB_OUTPUT"
            # Pipeline IDENTICO ao do caminho normal, de proposito: "$(...)"
            # come a quebra de linha final, entao computar o hash de outro
            # jeito daria valor diferente para o mesmo corpo -- e a comparacao
            # do ciclo seguinte nunca casaria.
            if atual="$(curl -fsS "$API_URL/meta/status" | sha256sum | cut -d' ' -f1)"; then
              echo "watermark=$atual" >> "$GITHUB_OUTPUT"
            else
              # Melhor esforço: sem watermark, o proximo ciclo reconstroi uma
              # vez a mais e se corrige sozinho. Bloquear aqui seria pior.
              echo "watermark=" >> "$GITHUB_OUTPUT"
              echo "API nao respondeu; esta publicacao vai sem watermark."
            fi
            echo "Rebuild por mudança de código ou disparo manual."
            exit 0
          fi

          # Falhar aqui é o comportamento certo: se a API não responde, não
          # dá para saber se o site está defasado, e fingir que está tudo
          # bem é justamente o modo de falha que este desenho existe para
          # evitar.
          atual="$(curl -fsS "$API_URL/meta/status" | sha256sum | cut -d' ' -f1)"

          # O build-info.json pode não existir (primeiro deploy) — 404 aqui
          # é "nunca publicamos", não erro.
          anterior="$(curl -fsS "$SITE_URL/build-info.json" 2>/dev/null | jq -r '.watermark // ""' || echo "")"

          echo "watermark=$atual" >> "$GITHUB_OUTPUT"

          if [ "$atual" = "$anterior" ]; then
            echo "reconstruir=false" >> "$GITHUB_OUTPUT"
            echo "Watermark inalterado ($atual) — nada a fazer."
          else
            echo "reconstruir=true" >> "$GITHUB_OUTPUT"
            echo "Watermark mudou: '$anterior' -> '$atual'."
          fi

      # O build morre se `generateStaticParams` devolver lista vazia: com
      # `output: export`, o Next exige ao menos uma rota gerada, e não há
      # escape. Em 07/09/2026 isso custou dois runs inteiros para descobrir
      # algo que uma chamada de um segundo responde -- e a mensagem do Next
      # ("returned an empty array") não diz que a causa é a ingestão não ter
      # rodado.
      #
      # Só `proposicoes` e `votacoes`: são as duas rotas que alimentam
      # `generateStaticParams`. Perfil não entra -- são 28 mil candidatos,
      # nunca foram pré-renderizados em massa, e dependem do fallback no
      # navegador (ver web/src/app/not-found.tsx).
      - name: confere que ha o que pre-renderizar
        if: steps.comparar.outputs.reconstruir == 'true'
        run: |
          set -uo pipefail

          for rota in proposicoes votacoes; do
            if ! corpo="$(curl -fsS "$API_URL/$rota")"; then
              echo "::error::a API nao respondeu em /$rota — o build falharia ao coletar as rotas"
              exit 1
            fi

            quantos="$(printf '%s' "$corpo" | jq '.ids | length')"
            echo "$rota: $quantos"

            if [ "$quantos" -eq 0 ]; then
              {
                echo "### Build abortado: \`$rota\` está vazio"
                echo ""
                echo "\`generateStaticParams\` devolveria lista vazia, e o \`output: export\`"
                echo "do Next recusa build sem nenhuma rota — não há escape para isso."
                echo ""
                echo "Causa provável: a ingestão ainda não rodou para esta fonte."
                echo "Ver o workflow **Rodar ingestão**."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$rota vazio — a ingestao precisa rodar antes do build"
              exit 1
            fi
          done

  # SEM `environment: production` -- e a unica publicacao do projeto sem
  # portao manual, decidido em 08/09/2026.
  #
  # A D4 (docs/PLANO_DEVSECOPS_IAC.md) pos clique manual em tudo que publica.
  # O que a pratica mostrou e que o custo aqui e alto e o risco baixo:
  #
  # - O cron dispara de hora em hora e a concorrencia enfileira. Um run parado
  #   esperando aprovacao trava TODOS os seguintes -- aconteceu com seis horas
  #   de fila, e o build que interessava nem comecava.
  # - O que este job faz e sincronizar arquivo estatico num bucket. Nao toca
  #   banco, nao troca imagem de servico, nao muda infraestrutura. Reverter e
  #   publicar de novo.
  #
  # O portao continua onde o estrago seria real: deploy da API, ingestao e
  # `terraform apply`.
  #
  # A `concurrency` segue `cancel-in-progress: false` de proposito -- cortar um
  # run no meio do `s3 sync --delete` deixaria o site pela metade.
  publicar:
    needs: decidir
    if: needs.decidir.outputs.reconstruir == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Com NEXT_PUBLIC_API_URL apontando para a API real, o
      # generateStaticParams busca a lista de ids na API (não nas
      # fixtures) — é o que faz o export conter os perfis de verdade.
      - name: build do export estático
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
        run: npm run build

      # A credencial vem DEPOIS do build, não antes.
      #
      # O token OIDC vale 1 hora. Gerar o export são ~79 mil páginas
      # (46.433 proposições + 32.493 votações) e passa disso, então pedir a
      # credencial no início do job a entregava já expirada ao `s3 sync`:
      # o build inteiro passava e a publicação morria em ExpiredToken,
      # arquivo por arquivo (08/09/2026).
      #
      # Nada antes daqui precisa de AWS: o build lê a API pública por HTTPS.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # São dezenas de milhares de arquivos pequenos, onde o tempo é de
      # ida-e-volta, não de banda. Subir a concorrencia encurta a janela em
      # que a credencial precisa continuar valendo.
      - name: mais requisicoes simultaneas no s3
        run: aws configure set default.s3.max_concurrent_requests 32

      # O --exclude NÃO é detalhe: o site e o pacote de dados abertos
      # dividem o prefixo `dados-abertos/` no mesmo bucket, e os
      # instantâneos datados (publicados pela ingestão, não pelo build)
      # não existem em ./out. Sem o exclude, o --delete os apagaria a cada
      # publicação — e eles são endereço de citação imutável
      # (docs/FRONTEND.md § 9).
      - name: sync para o S3
        run: |
          aws s3 sync ./out "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --exclude 'dados-abertos/20*'

      - name: publica o build-info.json com o watermark deste build
        run: |
          printf '{"watermark":"%s","commit":"%s","publicado_em":"%s"}\n' \
            "${{ needs.decidir.outputs.watermark }}" \
            "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build-info.json
          aws s3 cp build-info.json "s3://${{ vars.FRONTEND_BUCKET }}/build-info.json" \
            --cache-control "no-cache"

      - name: invalida o cache da CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
